<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 3D Card Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background: #070913;
            color: #f1f5f9;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .font-brand { font-family: 'Orbitron', sans-serif; }

        /* 3D Scene Wrapper */
        .phone-scene {
            perspective: 1000px;
            width: 100%;
            max-width: 350px;
            height: 210px;
            margin: 10px auto 20px auto;
        }

        .phone-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1);
        }

        .card-face {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            backface-visibility: hidden;
            overflow: hidden;
        }

        .card-front {
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            z-index: 2;
        }

        .card-back {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            transform: rotateY(180deg);
            z-index: 1;
        }

        .phone-card.flipped {
            transform: rotateY(180deg);
        }

        /* Holographic Light Shine */
        .card-shine {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.15) 0%, transparent 70%);
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        /* Gold Chip Simulation */
        .sim-chip {
            background: linear-gradient(135deg, #fde047 0%, #ca8a04 100%);
            border-radius: 4px;
            border: 1px solid #854d0e;
            position: relative;
            overflow: hidden;
        }
        .sim-chip::after {
            content: '';
            position: absolute;
            inset: 2px;
            border: 1px solid rgba(133, 77, 14, 0.4);
            border-radius: 2px;
        }

        /* Contactless Icon */
        .contactless {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.7);
            border-color: transparent transparent transparent rgba(255,255,255,0.8);
            border-radius: 50%;
            transform: rotate(45deg);
            margin-left: 6px;
        }

        .embossed-text {
            text-shadow: 1px 1px 0px rgba(255,255,255,0.15), -1px -1px 0px rgba(0,0,0,0.5);
        }

        input, select {
            background-color: #0b0f17;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 10px 12px;
            color: #cbd5e1;
            width: 100%;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 2px rgba(6,182,212,0.2);
        }
    </style>
</head>
<body>

    <div class="w-full max-w-sm bg-[#111827] border border-gray-800/80 rounded-2xl p-5 shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="text-lg font-bold text-cyan-400 font-brand">Mobile 3D Card Studio</h1>
            <p class="text-[11px] text-gray-400">আপনার তথ্য দিয়ে রিয়েলিস্টিক কার্ড তৈরি ও ডাউনলোড করুন</p>
        </div>

        <!-- 3D Interactive Card Preview -->
        <div class="phone-scene">
            <div id="phoneCard" class="phone-card" onclick="flipCard()">
                
                <!-- FRONT -->
                <div id="cardFrontSide" class="card-face card-front p-4 flex flex-col justify-between">
                    <div class="card-shine"></div>
                    
                    <!-- Top Row -->
                    <div class="flex justify-between items-center relative z-10">
                        <div class="flex items-center">
                            <div class="sim-chip w-10 h-7"></div>
                            <div class="contactless"></div>
                        </div>
                        <div id="lblNetwork" class="font-brand font-bold text-base italic text-white tracking-wider drop-shadow">VISA</div>
                    </div>

                    <!-- Middle Number -->
                    <div class="relative z-10 my-auto text-center">
                        <div id="lblNumber" class="text-lg tracking-widest font-bold embossed text-white">4532 8920 1928 3921</div>
                    </div>

                    <!-- Bottom Details -->
                    <div class="flex justify-between items-end relative z-10 text-[11px]">
                        <div>
                            <span class="text-[8px] block text-gray-300 uppercase">Card Holder</span>
                            <span id="lblName" class="font-bold uppercase tracking-wider embossed text-white">EMON KHAN</span>
                        </div>
                        <div>
                            <span class="text-[8px] block text-gray-300 uppercase">Expires</span>
                            <span id="lblExpiry" class="font-bold tracking-wider embossed text-white">09/28</span>
                        </div>
                        <div>
                            <span class="text-[8px] block text-gray-300 uppercase">DOB</span>
                            <span id="lblDob" class="font-bold tracking-wider embossed text-white">15/08/2000</span>
                        </div>
                    </div>
                </div>

                <!-- BACK -->
                <div class="card-face card-back flex flex-col justify-between py-4">
                    <div class="w-full h-9 bg-black mt-1"></div>
                    <div class="px-4">
                        <span class="text-[8px] text-gray-400">Authorized Signature</span>
                        <div class="w-full h-8 bg-white/20 rounded flex items-center justify-end px-3 mt-1">
                            <span id="lblCvv" class="text-gray-900 font-bold tracking-widest text-xs bg-white px-2 py-0.5 rounded">492</span>
                        </div>
                    </div>
                    <div class="text-[7px] text-center text-gray-500 px-4">
                        Original 3D Render Studio • For entertainment & design purpose only.
                    </div>
                </div>

            </div>
        </div>
        <div class="text-center mb-4">
            <span class="text-[10px] text-cyan-400 cursor-pointer" onclick="flipCard()">🔄 কার্ড উল্টাতে এখানে ট্যাপ করুন</span>
        </div>

        <!-- Custom Controls Form -->
        <div class="space-y-3 text-xs">
            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Card Brand</label>
                    <select id="inpNetwork" onchange="document.getElementById('lblNetwork').innerText=this.value">
                        <option value="VISA">Visa</option>
                        <option value="MASTERCARD">Mastercard</option>
                        <option value="RUPAY">RuPay</option>
                        <option value="BRAC BANK">BRAC Bank</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Theme / Color</label>
                    <select id="inpTheme" onchange="updateTheme(this.value)">
                        <option value="linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%)">Ocean Blue (BRAC)</option>
                        <option value="linear-gradient(135deg, #eab308 0%, #ca8a04 100%)">Gold Luxury</option>
                        <option value="linear-gradient(135deg, #10b981 0%, #047857 100%)">Emerald Dark</option>
                        <option value="linear-gradient(135deg, #f43f5e 0%, #881337 100%)">Ruby Velvet</option>
                        <option value="linear-gradient(135deg, #1e293b 0%, #0f172a 100%)">Midnight Black</option>
                    </select>
                </div>
            </div>

            <!-- Custom Color Picker Option -->
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">অথবা নিজের পছন্দমতো কালার দিন (Custom Color)</label>
                <div class="flex gap-2">
                    <input type="color" id="customColor1" value="#0ea5e9" class="h-9 p-1 cursor-pointer" onchange="applyCustomColor()">
                    <input type="color" id="customColor2" value="#0369a1" class="h-9 p-1 cursor-pointer" onchange="applyCustomColor()">
                </div>
            </div>

            <div>
                <label class="block text-[10px] text-gray-400 mb-1">Card Number</label>
                <input type="text" id="inputNumberField" value="4532 8920 1928 3921" oninput="document.getElementById('lblNumber').innerText=this.value">
            </div>

            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Card Holder Name</label>
                    <input type="text" id="inputNameField" value="EMON KHAN" oninput="document.getElementById('lblName').innerText=this.value.toUpperCase()">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Date of Birth (DOB)</label>
                    <input type="text" id="inputDobField" value="15/08/2000" oninput="document.getElementById('lblDob').innerText=this.value">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Expiry Date</label>
                    <input type="text" id="inputExpiryField" value="09/28" oninput="document.getElementById('lblExpiry').innerText=this.value">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">CVV Code</label>
                    <input type="text" id="inputCvvField" value="492" maxlength="4" oninput="document.getElementById('lblCvv').innerText=this.value">
                </div>
            </div>

            <!-- Download Button -->
            <div class="pt-2">
                <button onclick="downloadImage()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-gray-950 font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-1.5">
                    📥 Download HD Card Image
                </button>
            </div>
        </div>

    </div>

    <!-- Scripting for 3D Motion & Download -->
    <script>
        const card = document.getElementById('phoneCard');
        const frontSide = document.getElementById('cardFrontSide');

        function flipCard() {
            card.classList.toggle('flipped');
        }

        function updateTheme(gradientValue) {
            frontSide.style.background = gradientValue;
        }

        function applyCustomColor() {
            const c1 = document.getElementById('customColor1').value;
            const c2 = document.getElementById('customColor2').value;
            frontSide.style.background = `linear-gradient(135deg, ${c1} 0%, ${c2} 100%)`;
        }

        // Mobile Touch & Tilt Effect
        card.addEventListener('touchmove', (e) => {
            const rect = card.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left - rect.width / 2;
            const y = touch.clientY - rect.top - rect.height / 2;
            card.style.transform = `rotateX(${-y / 6}deg) rotateY(${x / 6}deg) ${card.classList.contains('flipped') ? 'rotateY(180deg)' : ''}`;
        });

        card.addEventListener('touchend', () => {
            card.style.transform = card.classList.contains('flipped') ? 'rotateY(180deg)' : 'rotateY(0deg)';
        });

        // Mouse Move Tilt for Desktop Preview
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            card.style.transform = `rotateX(${-y / 6}deg) rotateY(${x / 6}deg) ${card.classList.contains('flipped') ? 'rotateY(180deg)' : ''}`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = card.classList.contains('flipped') ? 'rotateY(180deg)' : 'rotateY(0deg)';
        });

        // Download handler
        function downloadImage() {
            if(card.classList.contains('flipped')) flipCard();
            setTimeout(() => {
                html2canvas(frontSide, { scale: 3, backgroundColor: null }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'my-3d-card.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            }, 250);
        }
    </script>
</body>
</html>
