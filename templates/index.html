<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate 3D Credit Card Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto Mono', monospace;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #e2e8f0;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .font-bank { font-family: 'Orbitron', sans-serif; }
        .font-numbers { font-family: 'Roboto Mono', monospace; letter-spacing: 0.05em; }

        /* 3D Perspective */
        .scene {
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 360px;
            height: 220px;
            margin-bottom: 2rem;
        }

        .card-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: grab;
        }
        
        /* Active Dragging State */
        .card-wrapper:active { cursor: grabbing; }

        /* Front and Back faces */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            backface-visibility: hidden;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .card-front {
            z-index: 2;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            background-image: url('data:image/svg+xml;charset=utf-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"%3E%3Cg fill-rule="evenodd"%3E%3Cg fill="%23ffffff" fill-opacity="0.03"%3E%3Cpath opacity=".5" d="M96 954.4l18.8 18.8-4.8 4.8-18.8-18.8L96 954.4zm0 0L77.2 973.2l4.8 4.8L100.8 959.2 96 954.4zm18.8-18.8l18.8 18.8-4.8 4.8-18.8-18.8 4.8-4.8zm0 0L77.2 935.6l4.8 4.8L100.8 954.4l-4.8-4.8zm-18.8-18.8L133.6 935.6l4.8 4.8L119.6 959.2l-4.8-4.8zm0 0L133.6 973.2l-4.8 4.8L110.8 959.2l4.8-4.8zm-18.8-18.8l18.8 18.8-4.8 4.8-18.8-18.8 4.8-4.8zm0 0L115.6 973.2l-4.8 4.8L92.8 959.2l4.8-4.8zm-18.8-18.8l18.8 18.8-4.8 4.8-18.8-18.8 4.8-4.8zm0 0L96.8 973.2l-4.8 4.8L74 959.2l4.8-4.8zM38.4 954.4l18.8 18.8-4.8 4.8L33.6 959.2 38.4 954.4zm0 0L19.6 973.2l4.8 4.8L43.2 959.2 38.4 954.4zm18.8-18.8l18.8 18.8-4.8 4.8-18.8-18.8 4.8-4.8zm0 0L19.6 935.6l4.8 4.8L43.2 954.4l-4.8-4.8zm-18.8-18.8L76 935.6l4.8 4.8L62 959.2l-4.8-4.8zm0 0L76 973.2l-4.8 4.8L53.2 959.2l4.8-4.8zm-18.8-18.8l18.8 18.8-4.8 4.8-18.8-18.8 4.8-4.8zm0 0L58 973.2l-4.8 4.8L35.2 959.2l4.8-4.8zm-18.8-18.8l18.8 18.8-4.8 4.8L2.4 959.2l4.8-4.8zm0 0L19.2 973.2l-4.8 4.8L-4.8 959.2l4.8-4.8z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
        }

        .card-back {
            z-index: 1;
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
        }

        /* The 3D Effect Layer */
        .shine {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 3;
        }

        /* Realistic Chip */
        .chip-texture {
            background: linear-gradient(to bottom right, #fde047, #a16207);
            border-radius: 4px;
            border: 1px solid #b45309;
            position: relative;
        }
        .chip-texture::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 75%; height: 75%;
            border: 1px solid #854d0e;
            border-radius: 2px;
        }

        /* Card Text Styling */
        .embossed-text {
            text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.1), -1px -1px 0 rgba(0, 0, 0, 0.4);
        }
        .embossed-text-deep {
             text-shadow: 2px 2px 2px rgba(255, 255, 255, 0.1), -2px -2px 2px rgba(0, 0, 0, 0.5);
        }

        /* Form Inputs & Buttons */
        input, select {
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 0.75rem;
            padding: 0.75rem;
            color: #e2e8f0;
            width: 100%;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2); }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid #374151;
            color: #a7f3d0;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-secondary:hover { background: rgba(167, 243, 208, 0.05); border-color: #a7f3d0; }

        /* Flip Button */
        .flip-btn-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 4;
        }

    </style>
</head>
<body>

    <div class="w-full max-w-md flex flex-col items-center">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-cyan-400 font-bank">Ultimate 3D Card Studio</h1>
            <p class="text-sm text-gray-400 mt-1">আপনার নিজস্ব কাস্টম 3D কার্ড তৈরি করুন</p>
        </div>

        <!-- 3D Card Scene -->
        <div class="scene">
            <div id="cardWrapper" class="card-wrapper">
                
                <!-- Front Face -->
                <div id="cardFront" class="card-face card-front p-6 flex flex-col justify-between shadow-2xl">
                    
                    <!-- Flip Button -->
                    <div class="flip-btn-container">
                        <button onclick="flipCard()" title="Flip Card" class="w-8 h-8 rounded-full bg-black/20 backdrop-blur-md border border-white/10 flex items-center justify-center text-white/60 hover:text-white transition">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.992 0 3.181 3.183a8.25 8.25 0 0 0 13.25-3.703m-3.743 5.252h4.992m-4.992 0 3.181 3.183a8.25 8.25 0 0 1-13.25 3.703M3.75 16.023a8.25 8.25 0 0 1 13.25-3.703m3.743 5.252a8.25 8.25 0 0 0-13.25 3.703" />
                            </svg>
                        </button>
                    </div>

                    <!-- Shimmer Effect -->
                    <div class="shine"></div>

                    <!-- Top Row: Chip & Brand -->
                    <div class="flex justify-between items-start relative z-10">
                        <div class="chip-texture w-14 h-10 rounded-md shadow-inner"></div>
                        <img id="networkLogo" src="https://upload.wikimedia.org/wikipedia/commons/b/b7/MasterCard_Logo_%282019%29.svg" alt="Network Logo" class="h-8 w-auto object-contain opacity-80 filter invert brightness-0 drop-shadow-sm">
                    </div>

                    <!-- Middle Row: Card Number -->
                    <div class="relative z-10 my-auto pt-6">
                        <div id="previewCardNumber" class="text-3xl font-numbers embossed-text-deep text-center tracking-wide font-extrabold">XXXX XXXX XXXX XXXX</div>
                    </div>

                    <!-- Bottom Row: Name & Expiry -->
                    <div class="flex justify-between items-end relative z-10 text-white/90">
                        <div class="w-2/3">
                            <p class="text-[10px] uppercase tracking-wider text-white/50">Card Holder</p>
                            <div id="previewCardName" class="text-sm font-semibold font-numbers tracking-wider embossed-text uppercase truncate">JOHN DOE</div>
                        </div>
                        <div class="w-1/3 text-right">
                            <p class="text-[10px] uppercase tracking-wider text-white/50">Expires</p>
                            <div id="previewCardExpiry" class="text-sm font-semibold font-numbers tracking-wider embossed-text">MM/YY</div>
                        </div>
                    </div>
